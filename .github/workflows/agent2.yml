name: Agent 2 - Knowledge Graph

on:
  workflow_run:
    workflows: ["GDELT Monitoring"]
    types:
      - completed

  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  agent2:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Agent 1 result
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: agent1-results
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Agent 1 result
        run: |
          echo "===== Agent 1 result ====="
          ls -la
          test -f agent1_results.json
          echo "agent1_results.json exists."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent 2
        run: |
          python agents/agent2_kg_analysis.py

      - name: Upload Agent 2 result
        uses: actions/upload-artifact@v4
        with:
          name: agent2-results
          path: agent2_results.json
          if-no-files-found: error
