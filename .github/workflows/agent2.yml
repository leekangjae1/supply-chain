name: Agent 2 - Knowledge Graph

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent2:
    runs-on: ubuntu-latest

    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Agent 1 결과 다운로드 (다른 workflow에서 실행되어 업로드된 경우)
      - name: Download Agent 1 result artifact
        uses: actions/download-artifact@v4
        with:
          name: agent1-results
          path: .
        continue-on-error: true

      - name: Check Agent 1 result
        run: |
          echo "===== Check Agent 1 result ====="
          if [ -f "agent1_results.json" ]; then
            echo "agent1_results.json exists."
            ls -lh agent1_results.json
          else
            echo "ERROR: agent1_results.json does not exist."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent 2
        run: |
          python agents/agent2_kg_analysis.py

      - name: Check Agent 2 result
        run: |
          echo "===== Agent 2 result ====="
          ls -lh agent2_results.json

      - name: Upload Agent 2 result
        uses: actions/upload-artifact@v4
        with:
          name: agent2-results
          path: agent2_results.json
          if-no-files-found: error        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent 2
        run: |
          python agents/agent2_kg_analysis.py

      - name: Check Agent 2 result
        run: |
          echo "===== Agent 2 result ====="
          ls -lh agent2_results.json

      - name: Upload Agent 2 result
        uses: actions/upload-artifact@v4
        with:
          name: agent2-results
          path: agent2_results.json
          if-no-files-found: error
          
