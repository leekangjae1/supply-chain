name: Agent 6 - Final Risk Report

on:
  workflow_run:
    workflows: ["Agent 5 - Risk Assessment"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  agent6:
    # Agent 5가 성공했을 때만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Repository Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python 설정
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. 필요한 패키지 설치
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. Agent 5 결과 다운로드
      # ============================================================
      - name: Download Agent 5 result
        uses: actions/download-artifact@v4
        with:
          name: agent5-results
          path: data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 5. Agent 5 결과 확인
      # ============================================================
      - name: Check Agent 5 result
        run: |
          echo "========================================"
          echo "Agent 5 result"
          echo "========================================"

          find data -type f -maxdepth 3 -print

      # ============================================================
      # 6. Agent 5 JSON을 Agent 6 입력 위치로 복사
      # ============================================================
      - name: Prepare Agent 6 input
        run: |

          if [ -f "data/agent5_risk_assessment.json" ]; then

            cp data/agent5_risk_assessment.json \
               agent5_risk_assessment.json

          elif [ -f "data/data/agent5_risk_assessment.json" ]; then

            cp data/data/agent5_risk_assessment.json \
               agent5_risk_assessment.json

          else

            echo "ERROR: agent5_risk_assessment.json not found"

            find . -name "agent5_risk_assessment.json" -print

            exit 1

          fi

          echo "========================================"
          echo "Agent 6 input"
          echo "========================================"

          ls -lh agent5_risk_assessment.json

      # ============================================================
      # 7. Agent 6 실행
      # ============================================================
      - name: Run Agent 6
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          python agents/agent6_report.py

      # ============================================================
      # 8. Agent 6 결과 확인
      # ============================================================
      - name: Check Agent 6 result
        run: |

          echo "========================================"
          echo "Agent 6 result"
          echo "========================================"

          if [ -f "agent6_final_report.json" ]; then

            ls -lh agent6_final_report.json

          else

            echo "ERROR: agent6_final_report.json not found"

            find . -name "agent6_final_report.json" -print

            exit 1

          fi

      # ============================================================
      # 9. Agent 6 결과 업로드
      # ============================================================
      - name: Upload Agent 6 result
        uses: actions/upload-artifact@v4
        with:
          name: agent6-results
          path: agent6_final_report.json
          if-no-files-found: error
