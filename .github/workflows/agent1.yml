name: GDELT Monitoring

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdelt-monitoring
  cancel-in-progress: true

jobs:
  run-gdelt:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OpenAI API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Run GDELT monitoring
        run: |
          python gdelt_monitoring.py

      - name: Run Agent 1 News Analysis
        run: |
          python agents/agent1_news_analysis.py

      - name: Check Agent 1 result
        run: |
          echo "===== Agent 1 result ====="
          if [ ! -f "agent1_results.json" ]; then
            echo "ERROR: agent1_results.json does not exist."
            exit 1
          fi
          ls -lh agent1_results.json
          python -m json.tool agent1_results.json > /dev/null
          echo "Agent 1 JSON is valid."

      - name: Upload Agent 1 result
        uses: actions/upload-artifact@v4
        with:
          name: agent1-results
          path: agent1_results.json
          if-no-files-found: error

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add gdelt_results.json gdelt_monitoring.csv agent1_results.json

          git diff --cached --quiet || git commit -m "Update GDELT and Agent 1 monitoring results"

          git push origin main
