name: GDELT Monitoring

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdelt-monitoring
  cancel-in-progress: true

jobs:
  run-gdelt:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run GDELT monitoring
        run: python gdelt_monitoring.py      
        
      - name: Run CrewAI Monitoring
        run: python crewai_monitoring.py

      # ======================================================
      # Agent 1 결과를 Artifact로 저장
      # ======================================================
      - name: Upload Agent 1 result
        uses: actions/upload-artifact@v4
        with:
          name: agent1-results
          path: agent1_results.json
          if-no-files-found: error

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # agent1_results.json 파일도 git add에 포함
          git add gdelt_results.json gdelt_monitoring.csv crewai_results.json agent1_results.json
          git commit -m "Update GDELT and Agent 1 monitoring results" || echo "No changes to commit"
          git push origin main
