name: GDELT Monitoring

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      news_source:
        description: "Agent 1에서 사용할 뉴스 입력 방식 선택"
        required: true
        type: choice
        default: data
        options:
          - data
          - gdelt
          - newsapi
          - both
          - all

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: supply-chain-news-agent1
  cancel-in-progress: false

jobs:
  run-news-agent1:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEWSAPI_AI_API_KEY: ${{ secrets.NEWSAPI_AI_API_KEY }}
      NEWS_SOURCE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.news_source || 'both' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OpenAI API key and input files
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "ERROR: OPENAI_API_KEY is not configured in GitHub Secrets."
            exit 1
          fi

          echo "Selected source mode: $NEWS_SOURCE_MODE"

          if [[ "$NEWS_SOURCE_MODE" == "data" || "$NEWS_SOURCE_MODE" == "all" ]]; then
            if ! find data -maxdepth 1 -type f -name '*.json' -print -quit | grep -q .; then
              echo "ERROR: No JSON files found in data/."
              echo "Upload the extracted JSON files, not only a ZIP archive."
              exit 1
            fi
            echo "JSON files found in data/:"
            find data -maxdepth 1 -type f -name '*.json' | sort
          fi

      - name: Run GDELT monitoring
        if: ${{ env.NEWS_SOURCE_MODE == 'gdelt' || env.NEWS_SOURCE_MODE == 'both' || env.NEWS_SOURCE_MODE == 'all' }}
        run: python gdelt_monitoring.py

      - name: Validate GDELT result
        if: ${{ env.NEWS_SOURCE_MODE == 'gdelt' || env.NEWS_SOURCE_MODE == 'both' || env.NEWS_SOURCE_MODE == 'all' }}
        run: |
          test -f gdelt_results.json || { echo "ERROR: gdelt_results.json was not created."; exit 1; }
          python -m json.tool gdelt_results.json > /dev/null
          echo "GDELT JSON is valid."

      - name: Check NewsAPI.ai API key
        if: ${{ env.NEWS_SOURCE_MODE == 'newsapi' || env.NEWS_SOURCE_MODE == 'both' || env.NEWS_SOURCE_MODE == 'all' }}
        run: |
          if [[ -z "$NEWSAPI_AI_API_KEY" ]]; then
            echo "ERROR: NEWSAPI_AI_API_KEY is not configured in GitHub Secrets."
            exit 1
          fi

      - name: Run NewsAPI.ai monitoring
        if: ${{ env.NEWS_SOURCE_MODE == 'newsapi' || env.NEWS_SOURCE_MODE == 'both' || env.NEWS_SOURCE_MODE == 'all' }}
        run: python newsapi_monitoring.py

      - name: Validate NewsAPI.ai result
        if: ${{ env.NEWS_SOURCE_MODE == 'newsapi' || env.NEWS_SOURCE_MODE == 'both' || env.NEWS_SOURCE_MODE == 'all' }}
        run: |
          test -f newsapi_results.json || { echo "ERROR: newsapi_results.json was not created."; exit 1; }
          python -m json.tool newsapi_results.json > /dev/null
          echo "NewsAPI.ai JSON is valid."

      - name: Run Agent 1 using selected source
        run: python agents/agent1_news_analysis.py

      - name: Validate Agent 1 result
        run: |
          test -f agent1_results.json || { echo "ERROR: agent1_results.json was not created."; exit 1; }
          python -m json.tool agent1_results.json > /dev/null
          echo "Agent 1 JSON is valid."
          ls -lh agent1_results.json

      - name: Upload Agent 1 result for Agent 2
        uses: actions/upload-artifact@v4
        with:
          name: agent1-results
          path: agent1_results.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw news results for debugging
        uses: actions/upload-artifact@v4
        with:
          name: news-raw-results
          path: |
            data/*.json
            gdelt_results.json
            gdelt_monitoring.csv
            newsapi_results.json
            newsapi_monitoring.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in gdelt_results.json gdelt_monitoring.csv newsapi_results.json newsapi_monitoring.csv agent1_results.json; do
            if [[ -f "$file" ]]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update ${NEWS_SOURCE_MODE} news and Agent 1 results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
