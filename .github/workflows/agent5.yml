name: Agent 5 Risk Assessment

on:
  workflow_dispatch:

jobs:
  agent5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Agent 5
        run: |
          python agent5.py

      - name: Upload Agent 5 result
        uses: actions/upload-artifact@v4
        with:
          name: agent5-risk-assessment
          path: data/agent5_risk_score.json
