name: Agent 5 Risk Assessment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  agent5:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Agent 2의 최신 성공 실행 찾기
      # ==========================================
      - name: Find latest Agent 2 run
        id: agent2_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "===== Finding latest Agent 2 run ====="

          RUN_ID=$(gh run list \
            --workflow "agent2.yml" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful Agent 2 workflow found."
            exit 1
          fi

          echo "Agent 2 Run ID: $RUN_ID"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 3. Agent 2 Artifact 다운로드
      # ==========================================
      - name: Download Agent 2 result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "===== Downloading Agent 2 result ====="

          mkdir -p data

          gh run download \
            ${{ steps.agent2_run.outputs.run_id }} \
            --name agent2-results \
            --dir data

      # ==========================================
      # 4. Agent 2 결과 확인
      # ==========================================
      - name: Check Agent 2 result
        run: |
          echo "===== Agent 2 result ====="

          pwd

          echo "===== data directory ====="
          ls -lah data/

          if [ -f "data/agent2_results.json" ]; then
            echo "SUCCESS: agent2_results.json exists."
          else
            echo "ERROR: agent2_results.json does not exist."
            exit 1
          fi

      # ==========================================
      # 5. Agent 5 입력 파일 준비
      # ==========================================
      - name: Prepare Agent 5 input
        run: |
          cp data/agent2_results.json data/agent2_kg.json

          echo "===== Agent 5 input ====="
          ls -lh data/agent2_kg.json

      # ==========================================
      # 6. Python 설정
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 7. 패키지 설치
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 8. Agent 5 실행
      # ==========================================
      - name: Run Agent 5
        run: |
          python agents/agent5_risk_score.py

      # ==========================================
      # 9. Agent 5 결과 확인
      # ==========================================
      - name: Check Agent 5 result
        run: |
          echo "===== Agent 5 result ====="
          ls -lah data/

          if [ -f "data/agent5_risk_assessment.json" ]; then
            echo "SUCCESS: Agent 5 result exists."
          else
            echo "ERROR: Agent 5 result does not exist."
            exit 1
          fi

      # ==========================================
      # 10. 결과 업로드
      # ==========================================
      - name: Upload Agent 5 result
        uses: actions/upload-artifact@v4
        with:
          name: agent5-risk-assessment
          path: data/agent5_risk_assessment.json
          if-no-files-found: error
