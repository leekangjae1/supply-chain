name: Agent 5 - Risk Assessment

on:
  workflow_run:
    workflows: ["agent2.yml"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  agent5:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ⭐ Agent 2 결과 가져오기
      - name: Download Agent 2 result
        uses: actions/download-artifact@v4
        with:
          name: agent2-results
          path: data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ⭐ 확인
      - name: Check Agent 2 result
        run: |
          echo "=== data directory ==="
          ls -lah data
          echo "=== Agent 2 JSON ==="
          ls -lah data/agent2_kg.json

      - name: Run Agent 5
        run: |
          python agents/agent5_risk_score.py

      - name: Upload Agent 5 result
        uses: actions/upload-artifact@v4
        with:
          name: agent5-results
          path: |
            agent5_risk_assessment.json
            data/agent5_risk_assessment.json
