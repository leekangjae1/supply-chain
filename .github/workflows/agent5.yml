name: Agent 5 Risk Assessment

on:
  # Agent 2가 성공적으로 끝나면 자동 실행
  workflow_run:
    workflows: ["Agent 2 - Knowledge Graph"]
    types:
      - completed

  # GitHub Actions에서 수동 실행도 가능
  workflow_dispatch:

jobs:
  agent5:
    # workflow_run으로 실행될 경우 Agent 2가 성공했을 때만 실행
    # workflow_dispatch로 직접 실행할 경우에는 항상 실행
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    # ========================================================
    # GitHub Secrets → 환경변수
    # ========================================================
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

    steps:

      # ======================================================
      # 1. GitHub repository 가져오기
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python 설정
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. 필요한 패키지 설치
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 4. Agent 5 실행
      # ======================================================
      - name: Run Agent 5
        run: |
          python agents/agent5_risk_score.py

      # ======================================================
      # 5. Agent 5 결과 저장
      # ======================================================
      - name: Upload Agent 5 result
        uses: actions/upload-artifact@v4
        with:
          name: agent5-risk-assessment
          path: data/agent5_risk_score.json
