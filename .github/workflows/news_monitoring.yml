name: GDELT Monitoring

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-gdelt:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        risk_group: [disaster, operation, policy_regulation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run GDELT monitoring
        env:
          RISK_GROUP: ${{ matrix.risk_group }}
        run: python gdelt_monitoring.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add gdelt_results.json gdelt_monitoring.csv
          git commit -m "Update GDELT monitoring results" || echo "No changes to commit"
          git push
